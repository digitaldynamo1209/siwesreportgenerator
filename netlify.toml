# Netlify Configuration
[build]
  publish = "app/static"

# Proxy API calls to your live Python backend (e.g. Render / Railway)
# Replace with your actual backend URL once deployed
[[redirects]]
  from = "/api/*"
  to = "https://siwes-report-generator.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
